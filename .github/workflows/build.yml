on:
  pull_request:
  push:
    branches: [ main ]

name: Build and Test

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        config: [debug, release]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-
      
      - name: Build project (${{ matrix.config }})
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            # Build universal binary for release
            swift build -c release --arch arm64
            swift build -c release --arch x86_64
            mkdir -p .build/universal-apple-macosx/release
            lipo -create \
              .build/arm64-apple-macosx/release/aeroswitch \
              .build/x86_64-apple-macosx/release/aeroswitch \
              -output .build/universal-apple-macosx/release/aeroswitch
            echo "Universal binary created:"
            file .build/universal-apple-macosx/release/aeroswitch
          else
            swift build
          fi
      
      - name: Test version command
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            ./.build/universal-apple-macosx/release/aeroswitch --version
          else
            ./.build/debug/aeroswitch --version
          fi
      
      - name: Test help command
        run: |
          if [ "${{ matrix.config }}" = "release" ]; then
            ./.build/universal-apple-macosx/release/aeroswitch --help
          else
            ./.build/debug/aeroswitch --help
          fi
      
      - name: Verify binary size (release only)
        if: matrix.config == 'release'
        run: |
          ls -lh .build/universal-apple-macosx/release/aeroswitch
          # Ensure binary is reasonable size (less than 10MB)
          SIZE=$(stat -f%z .build/universal-apple-macosx/release/aeroswitch)
          if [ $SIZE -gt 10485760 ]; then
            echo "Binary is too large: ${SIZE} bytes"
            exit 1
          fi
