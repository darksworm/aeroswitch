on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
          version-file: VERSION
          changelog-path: CHANGELOG.md
          extra-files: '["VERSION"]'

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Build universal binary
        run: |
          # Build for both architectures
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          
          # Create universal binary
          mkdir -p .build/universal-apple-macosx/release
          lipo -create \
            .build/arm64-apple-macosx/release/aeroswitch \
            .build/x86_64-apple-macosx/release/aeroswitch \
            -output .build/universal-apple-macosx/release/aeroswitch
          
          # Verify the universal binary
          file .build/universal-apple-macosx/release/aeroswitch
          lipo -info .build/universal-apple-macosx/release/aeroswitch
      
      - name: Create release archive
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          make archive BINARY_PATH=.build/universal-apple-macosx/release/aeroswitch VERSION=${VERSION}
      
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/aeroswitch-*.tar.gz
            releases/aeroswitch-*.sha256
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get release info
        id: release_info
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          ARCHIVE_PATH="releases/aeroswitch-${VERSION}-macos.tar.gz"
          SHA256=$(cat "releases/aeroswitch-${VERSION}-macos.tar.gz.sha256" | cut -d' ' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "archive_url=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aeroswitch-${VERSION}-macos.tar.gz" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
      
      - name: Update Homebrew formula
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ${{ github.repository_owner }}/homebrew-aeroswitch
          event-type: update-formula
          client-payload: |
            {
              "version": "${{ steps.release_info.outputs.version }}",
              "archive_url": "${{ steps.release_info.outputs.archive_url }}",
              "sha256": "${{ steps.release_info.outputs.sha256 }}"
            }